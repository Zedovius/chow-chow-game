<!doctype html>
<!-- Para probar a los animales, las peleas contra los jefes y los tragos, sin guardar récords (ver js/config.js). Se
     publica con el juego, como /jefes; no sale en los buscadores. En local necesita un servidor, como el juego.
     Primero el celular: todo se toca con el pulgar, las pestañas se quedan abajo y las opciones se despliegan. -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b0b0c">
  <title>Chow Chow: pruebas</title>
  <link rel="icon" href="assets/icons/icon-192.png">
  <style>
    @font-face { font-family: "Press Start 2P"; font-display: swap; src: url("assets/fonts/press-start-2p-latin.woff2") format("woff2"); }
    @font-face { font-family: "Pixelify Sans"; font-weight: 400 700; font-display: swap; src: url("assets/fonts/pixelify-sans-latin.woff2") format("woff2"); }
    :root { --black: #0b0b0c; --ink: #131314; --gray: #1d1d1f; --line: #38383b; --white: #e8e4dd; --dim: #a8a49d; --red: #b8222b; --red-light: #dd333a; color-scheme: dark; --gap: 10px; }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(84px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); background: var(--black); color: var(--white); font: 17px/1.35 "Pixelify Sans", system-ui, sans-serif; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
    main { max-width: 1080px; margin: 0 auto; }
    h1 { margin: 4px 0 2px; font: 400 18px/1.3 "Press Start 2P", monospace; }
    h1::after { content: ""; display: block; width: 28px; height: 2px; margin: 10px 0 12px; background: var(--red); }
    p { margin: 0 0 14px; color: var(--dim); }

    details { margin: 0 0 16px; border: 1px solid var(--line); background: var(--ink); }
    summary { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 8px 14px; cursor: pointer; list-style: none; }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: "▼"; font-size: 12px; color: var(--red-light); }
    details[open] summary::after { content: "▲"; }
    summary small { margin-left: auto; text-align: right; color: var(--dim); }
    fieldset { display: grid; gap: 0; margin: 0; padding: 0 14px 8px; border: 0; }
    .level { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding-bottom: 8px; }
    .level label { justify-content: center; border: 1px solid var(--line); background: var(--gray); }
    .level label:has(:checked) { border-color: var(--red); background: var(--red); }
    .level input { position: absolute; opacity: 0; }
    label { display: flex; align-items: center; justify-content: space-between; gap: 14px; min-height: 48px; padding: 0 4px; cursor: pointer; }
    .check { border-top: 1px solid var(--line); }
    .check input { flex: none; width: 24px; height: 24px; margin: 0; accent-color: var(--red); }
    label:has(:focus-visible) { outline: 2px solid var(--white); outline-offset: -2px; }

    section[hidden] { display: none; }
    ul { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--gap); margin: 0; padding: 0; list-style: none; }
    #animals { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    a { display: grid; justify-items: center; align-content: start; gap: 8px; height: 100%; min-height: 112px; padding: 12px 8px; border: 1px solid var(--line); background: var(--ink); color: inherit; text-align: center; text-decoration: none; }
    a:active { border-color: var(--red); background: var(--gray); }
    @media (hover: hover) { a:hover { border-color: var(--red); background: var(--gray); } }
    a:focus-visible { border-color: var(--red); outline: 2px solid var(--white); }
    strong { display: block; font-weight: 500; font-size: 18px; line-height: 1.2; }
    small { font-size: 14px; color: var(--dim); }
    .logo { width: 72px; height: 72px; background: var(--red-light); -webkit-mask: var(--logo) center / contain no-repeat; mask: var(--logo) center / contain no-repeat; }
    .boss { width: 100%; max-width: 150px; height: 112px; object-fit: contain; image-rendering: pixelated; }
    .glass { width: 88px; aspect-ratio: 96 / 124; background-size: 800% auto; background-position: 85.714% 0; }

    /* Las pestañas, abajo, donde llega el pulgar */
    nav { position: fixed; inset: auto 0 0; z-index: 1; display: grid; grid-template-columns: repeat(3, 1fr); padding: 0 env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); border-top: 1px solid var(--line); background: var(--black); }
    nav button { min-height: 60px; border: 0; border-top: 3px solid transparent; background: none; color: var(--dim); font: inherit; cursor: pointer; }
    nav button[aria-selected="true"] { border-color: var(--red); color: var(--white); background: var(--ink); }
    nav button:focus-visible { outline: 2px solid var(--white); outline-offset: -3px; }

    @media (max-width: 340px) { #animals { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (min-width: 600px) {
      #animals { grid-template-columns: repeat(6, minmax(0, 1fr)); }
      ul { grid-template-columns: repeat(4, minmax(0, 1fr)); }
    }
    @media (min-width: 900px) and (min-height: 541px) {
      body { padding: 32px 24px 48px; }
      nav { position: static; max-width: 560px; margin: 0 0 20px; border: 1px solid var(--line); }
      nav button { min-height: 52px; }
      details { max-width: 560px; }
      ul { grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 14px; }
    }
    @media (orientation: landscape) and (max-height: 540px) {
      body { padding-bottom: calc(62px + env(safe-area-inset-bottom)); }
      h1, p { display: none; }
      nav button { min-height: 46px; }
    }
  </style>
</head>
<body>
  <main>
    <h1>Pruebas</h1>
    <p>Aquí no se guarda ningún récord.</p>
    <nav role="tablist" aria-label="Qué probar">
      <button type="button" role="tab" data-tab="jugar">Jugar</button>
      <button type="button" role="tab" data-tab="jefes">Jefes</button>
      <button type="button" role="tab" data-tab="tragos">Tragos</button>
    </nav>
    <details id="options">
      <summary>Opciones <small id="chosen"></small></summary>
      <fieldset>
        <div class="level">
          <label><input type="radio" name="dificultad" value="easy" checked>Fácil</label>
          <label><input type="radio" name="dificultad" value="hard">Difícil</label>
        </div>
        <label class="check">No perder corazones<input type="checkbox" name="invencible"></label>
        <label class="check">Fuego jade (trío completo)<input type="checkbox" name="trio"></label>
        <label class="check">Empezar volando (estrella)<input type="checkbox" name="vuelo"></label>
        <label class="check">Ver cajas de choque<input type="checkbox" name="cajas"></label>
      </fieldset>
    </details>
    <section data-panel="jugar"><ul id="animals"><li>Abre esta página desde un servidor, como el juego.</li></ul></section>
    <section data-panel="jefes" hidden><ul id="list"></ul></section>
    <section data-panel="tragos" hidden><ul id="drinks"></ul></section>
  </main>
  <script type="module">
    import { ZODIAC, rivalOf } from './js/world/levels.js';
    import { cocktailOf } from './js/world/cocktails.js';
    import { BOSS_ART } from './js/graphics/bossArt.js';
    import { glassSheet } from './js/graphics/glassArt.js';
    import { es } from './js/i18n/es.js';

    const options = document.getElementById('options');
    const KEY = 'chowchow.pruebas';
    const inputs = { hard: '[value="hard"]', trio: '[name="trio"]', invencible: '[name="invencible"]', vuelo: '[name="vuelo"]', cajas: '[name="cajas"]' };
    const NAMES = { trio: 'jade', invencible: 'sin perder', vuelo: 'volando', cajas: 'cajas' };
    const input = (key) => options.querySelector(inputs[key]);
    const read = () => Object.fromEntries(Object.keys(inputs).map((key) => [key, input(key).checked]));
    // Se recuerda lo elegido (y la pestaña) mientras siga abierta
    let saved = {};
    try {
      saved = JSON.parse(sessionStorage.getItem(KEY)) ?? {};
    } catch { /* sin almacenamiento, empieza con lo de siempre */ }
    for (const key of Object.keys(inputs)) input(key).checked = Boolean(saved[key]);
    let tab = ['jugar', 'jefes', 'tragos'].includes(saved.tab) ? saved.tab : 'jugar';
    const save = () => {
      try { sessionStorage.setItem(KEY, JSON.stringify({ ...read(), tab })); } catch { /* da igual */ }
    };

    const nameOf = (id) => es[`zodiac.${id}`];
    const span = (className) => {
      const el = document.createElement('span');
      el.className = className;
      return el;
    };
    const logo = (id) => {
      const el = span('logo');
      el.style.setProperty('--logo', `url("${new URL(`assets/images/logos/${id}.svg`, location.href).href}")`);
      return el;
    };
    /** Un botón: adónde lleva, su dibujo, su título y el renglón de abajo. */
    function card(query, icon, title, detail = '') {
      const { hard, trio, invencible, vuelo, cajas } = read();
      const params = new URLSearchParams(query.trago ? query : { ...query, dificultad: hard ? 'hard' : 'easy' });
      if (!query.trago) for (const [key, on] of Object.entries({ trio, invencible, vuelo, cajas })) if (on) params.set(key, '1');
      const link = document.createElement('a');
      link.href = './?' + params;
      const text = document.createElement('span');
      const strong = document.createElement('strong');
      strong.textContent = title;
      text.append(strong);
      if (detail) {
        const small = document.createElement('small');
        small.textContent = detail;
        text.append(small);
      }
      link.append(icon, text);
      const li = document.createElement('li');
      li.append(link);
      return li;
    }

    function bossIcon(id) {
      const art = BOSS_ART[id];
      if (!art) return logo(id);
      // Su hoja trae el cuerpo en rebanadas, de atrás hacia adelante: se juntan
      const canvas = document.createElement('canvas');
      canvas.className = 'boss';
      canvas.width = art.w;
      canvas.height = art.h;
      const sheet = new Image();
      sheet.onload = () => {
        for (let l = 0; l < art.layers; l++) canvas.getContext('2d').drawImage(sheet, 0, l * art.h, art.w, art.h, 0, 0, art.w, art.h);
      };
      sheet.src = art.body;
      return canvas;
    }
    function glass(id) {
      const el = span('glass');
      el.style.backgroundImage = `url(${glassSheet(id)})`;
      return el;
    }

    function render() {
      save();
      const chosen = read();
      document.getElementById('chosen').textContent = [chosen.hard ? 'Difícil' : 'Fácil', ...Object.keys(NAMES).filter((key) => chosen[key]).map((key) => NAMES[key])].join(' · ');
      document.getElementById('animals').replaceChildren(...ZODIAC.map(({ id }) => card({ animal: id }, logo(id), nameOf(id))));
      document.getElementById('list').replaceChildren(...ZODIAC.map(({ id }) => card({ jefe: id }, bossIcon(id), nameOf(id), `Tú eres ${nameOf(rivalOf(id).id)}`)));
    }
    function show(name) {
      tab = name;
      save();
      for (const button of document.querySelectorAll('[data-tab]')) button.setAttribute('aria-selected', String(button.dataset.tab === tab));
      for (const panel of document.querySelectorAll('[data-panel]')) panel.hidden = panel.dataset.panel !== tab;
      options.hidden = tab === 'tragos'; // para ver un trago no hace falta nada
    }
    for (const button of document.querySelectorAll('[data-tab]')) button.addEventListener('click', () => { show(button.dataset.tab); scrollTo(0, 0); });
    document.getElementById('drinks').replaceChildren(...ZODIAC.map(({ id }) => card({ trago: id }, glass(id), cocktailOf(id)?.name ?? nameOf(id), nameOf(id))));
    options.addEventListener('change', render);
    render();
    show(tab);
  </script>
</body>
</html>
